name: Build Standalone Executables

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the build (e.g. v1.0.0-beta)"
        required: false
        default: "dev"

jobs:

  # ── macOS (Apple Silicon) ───────────────────────────────────────────────────
  build-macos:
    runs-on: macos-14   # arm64 (Apple Silicon)
    permissions:
      contents: write   # push the zip straight to a Release (no artifact quota)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # CPU-only torch keeps the bundle under 2 GB (avoids CUDA wheels)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller
          # Fetch the default YOLO nano model. It's gitignored (*.pt) so it isn't
          # in the checkout; ultralytics downloads it into the build dir here so
          # the PyInstaller spec can bundle it.
          python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"

      - name: Fetch FFmpeg (bundle into app)
        run: |
          mkdir -p bin
          for name in ffmpeg ffprobe; do
            curl -L "https://evermeet.cx/ffmpeg/getrelease/$name/zip" -o "$name.zip"
            unzip -o "$name.zip" "$name" -d bin
            chmod +x "bin/$name"
          done
          bin/ffmpeg -version | head -1

      - name: Build with PyInstaller
        run: pyinstaller steadycut.spec --distpath dist/

      - name: Verify build
        run: test -d dist/SteadyCut.app && echo "Build succeeded"

      - name: Zip app bundle
        run: |
          cp packaging/install.command dist/install.command
          chmod +x dist/install.command
          cd dist && zip -r SteadyCut-macOS-arm64.zip SteadyCut.app install.command

      - name: Publish zip to release (bypasses Actions artifact quota)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          # Release assets live in Release storage, NOT the 500MB Actions
          # artifact pool — so ~800MB builds upload without hitting the quota.
          gh release create "$TAG" --prerelease --title "$TAG (CI build)" \
            --notes "Automated CI build from ${{ github.sha }}" || true
          gh release upload "$TAG" dist/SteadyCut-macOS-arm64.zip --clobber

  # ── Windows x64 ────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write   # push the zip straight to a Release (no artifact quota)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller
          # Fetch the default YOLO nano model. It's gitignored (*.pt) so it isn't
          # in the checkout; ultralytics downloads it into the build dir here so
          # the PyInstaller spec can bundle it.
          python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"

      - name: Fetch FFmpeg (bundle into app)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted -Force
          $root = Get-ChildItem ffmpeg_extracted -Directory | Select-Object -First 1
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe"  bin\ffmpeg.exe
          Copy-Item "$($root.FullName)\bin\ffprobe.exe" bin\ffprobe.exe
          & bin\ffmpeg.exe -version | Select-Object -First 1

      - name: Build with PyInstaller
        run: pyinstaller steadycut.spec --distpath dist\

      - name: Verify build
        run: |
          if (Test-Path "dist\SteadyCut\SteadyCut.exe") {
            Write-Output "Build succeeded"
          } else {
            Write-Error "Build failed — SteadyCut.exe not found"
            exit 1
          }

      - name: Zip dist folder
        run: |
          cd dist
          Compress-Archive -Path SteadyCut -DestinationPath SteadyCut-Windows-x64.zip

      - name: Publish zip to release (bypasses Actions artifact quota)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          # Release assets live in Release storage, NOT the 500MB Actions
          # artifact pool — so the build uploads without hitting the quota.
          gh release create "$TAG" --prerelease --title "$TAG (CI build)" \
            --notes "Automated CI build from ${{ github.sha }}" || true
          gh release upload "$TAG" dist/SteadyCut-Windows-x64.zip --clobber

  # NOTE: the old `release` job (download-artifact → softprops) was removed — it
  # relied on the Actions artifact pool that hits the 500MB free quota. Each
  # build job now publishes its zip directly to the Release (tag = inputs.version
  # on dispatch, or the pushed tag on a v*.*.* push). Follow-up: re-add rich
  # release notes / the install-instructions table into the build step if wanted.
